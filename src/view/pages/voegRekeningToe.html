<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voeg rekening toe</title>
    <!-- <link rel="stylesheet" href="./style.css" /> -->
    <script type="module" src="./src/main.js"></script>
    <!-- <script type="module" src="./src/github-AantalRequestsLimiet.js"></script> -->

</head>



<body>

    <form id="rekeningToevoegenForm">
        <label for="naam">Naam rekening</label>
        <input type="text" id="naam" name="naam" required value="P Puk">
        <br>

        <label for="userNaam">Naam</label>
        <select id="userNaam" name="userNaam">
            <option value="">Selecteer een gebruiker</option>
        </select>

        <input type="text" id="userId" name="userId" required value="">
        <br>
        <!-- userId auto generate -->

        <br>
        <label for="bedrag">Bedrag</label>
        <input type="number" id="bedrag" name="bedrag" step="0.01" required>
        <br>
        <label for="omschrijving">Omschrijving</label>
        <input type="text" id="omschrijving" name="omschrijving" required>
        <br>
        <label for="datumAfschrijving">Datum afschrijving</label>
        <input type="date" id="datumAfschrijving" name="datumAfschrijving" required>

        <label>
            <input type="checkbox" name="isAfgeschreven">
            Is afgeschreven
        </label>
        <br>
        <label>
            <input type="checkbox" name="terugkerendeAfschrijving">
            Terugkerende afschrijving
        </label>

        <button id="rekeningToevoegenForm" type="submit">Rekening toevoegen</button>
    </form>

    <footer>

        <script type="module">

            import { RekeningHouderSelecteren } from "@services/RekeningHouderSelecteren.ts";

            RekeningHouderSelecteren()

        </script>

        <script type="module" src="../../../formVerwerken.ts" onload="console.log('formVerwerken.js succesvol geladen')"
            onerror="console.log('formVerwerken.js 400 niet geladen')">
            </script>


    </footer>
</body>



</html>
