  <main>

    <p class="dbContent">text</p>
    <a href="${Routes.voegRekeningToe}">voegRekeningToe.html</a>

    <script type="module">

      import { FetchDB } from '@services/FetchDB.ts'
      FetchDB()
        // Bij succesvolle afhandeling.
        .then(data => {
          console.log('Data ontvangen:');
          console.table(data);

          // get Naam
          let naam = document.querySelector('.dbContent').innerHTML = data["users"][0]["naam"];
          console.log(naam)

          let UserID = document.querySelector('.dbContent').innerHTML = data["users"][0].userId;
          console.log(UserID)
          // get Saldo
          let saldo = document.querySelector('.dbContent').innerText += "\n" + "saldo: " + data["users"][0]["saldo"];
        })

        // Bij fouten.
        .catch(error => {
          console.error('Fetch error:', error);
        })

        // Wordt altijd uitgevoerd.
        .finally(() => {
          console.log('Fetch afgerond.');
        });


    </script>

  </main>
